components:
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 4096
      description: Opaque server-issued resource identifier.
    Timestamp:
      type: string
      format: date-time
    Base64Url:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: ^[A-Za-z0-9_-]+$
    Sha256Hex:
      type: string
      pattern: ^[0-9a-f]{64}$
    DerBase64:
      type: string
      minLength: 1
      contentEncoding: base64
      description: Base64-encoded DER bytes.
    CsrDerBase64:
      type: string
      minLength: 1
      contentEncoding: base64
      description: Base64-encoded PKCS#10 CSR DER. Schema limits encoded length to 87384 characters; server MUST also enforce
        <=65536 bytes after Base64 decode.
      x-max-decoded-bytes: 65536
      maxLength: 87384
    CertificateUsage:
      type: string
      minLength: 1
      maxLength: 4096
      example: PARTNER_AUTH
    AssuranceLevel:
      type:
      - string
      - 'null'
      enum:
      - A0
      - A1
      - A2
      - A3
      - null
    EnrollmentOperation:
      type: string
      enum: &id014
      - INITIAL
      - RENEWAL
      - REKEY
    EnrollmentState:
      type: string
      enum: &id011
      - CHALLENGE_ISSUED
      - EVIDENCE_RECEIVED
      - AUTHORIZED
      - CA_REQUESTED
      - CERT_ISSUED
      - CERT_DELIVERED
      - DEVICE_ACTIVATED
      - COMPLETED
      - REJECTED
      - EXPIRED
      - CA_FAILED
      - INSTALL_FAILED
      - ABORTED
      - CERT_WITHHELD_REVOKED
    PreOnboardingStatus:
      type: string
      enum: &id012
      - PENDING_APPROVAL
      - ENROLLMENT_READY
      - REJECTED
      - EXPIRED
      - INVALIDATED
    RevocationScope:
      type: string
      enum:
      - CERTIFICATE
      - KEY
      - USAGE
      - TPM_IDENTITY
      - DEVICE
      - PARTNER
    RevocationStatus:
      type: string
      enum: &id013
      - REVOCATION_REQUESTED
      - CA_REVOKED
      - CRL_PUBLISHED
      - PARTIAL
      - FAILED
    PartnerAuthorization:
      type: object
      additionalProperties: true
      required:
      - partner_id
      - display_name
      - scopes
      properties:
        partner_id:
          $ref: '#/components/schemas/ResourceId'
        display_name:
          type: string
          minLength: 1
          maxLength: 4096
